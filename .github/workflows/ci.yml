name: CI

# Required for every pull request to main (branch protection: "checks").
# Actions are pinned to a commit SHA: a moved tag can't change what runs here.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.0'
          tools: composer

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: PHP lint
        run: find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Core tests
        run: php tests/CoreTest.php

      - name: Relay tests
        run: node --check relay/worker.js && node tests/relay-test.mjs

      - name: Build and lint JS
        run: |
          npm ci
          npm run lint:js
          npm run build
